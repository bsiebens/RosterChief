{% load i18n lucide ui %}
{% comment %}
    One row of the public registration page's own entry formset. Rendered
    both for the rows already in the formset and (with __prefix__
    placeholders) into the <template> the "Add another person" button
    clones from -- same mechanism as management/_product_variant_formset_row.html
    (static/js/bulk-add-rows.js).
{% endcomment %}
<div class="bulk-add-row rounded-box border border-base-300 p-3">
    <div class="flex items-start justify-between gap-2">
        <div class="grid flex-1 grid-cols-1 gap-4 md:grid-cols-2">
            {% form_field form.first_name %}
            {% form_field form.last_name %}
        </div>
        <button class="btn btn-ghost btn-sm btn-square remove-row mt-6" type="button" aria-label="{% trans 'Remove this person' %}" title="{% trans 'Remove this person' %}">{% lucide "x" size=16 %}</button>
    </div>
    <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
        {% form_field form.date_of_birth %}
        {% form_field form.is_contact %}
    </div>
    <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
        {% form_field form.entry_kind %}
        {% form_field form.product_variant %}
    </div>
    <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
        {% form_field form.requested_team %}
        {% form_field form.requested_position %}
    </div>
</div>
