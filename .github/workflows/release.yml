name: Release
# Pushing a tag vX.Y.Z (rc release does this) builds the artifacts the servers download.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check
        run: |
          uv sync --locked
          # Lint is not a release gate while the repository still has older ruff findings (see ci.yml).
          uv run python manage.py check
        env:
          DJANGO_DEBUG: "True"
          DJANGO_SECRET_KEY: ci-only
          DJANGO_DATABASE_URL: postgresql://localhost/ci

      - name: Build the frontends and keep only runtime dependencies
        run: |
          for app in management controlpanel; do
            (cd "frontend/$app" && npm ci --no-audit --no-fund && npm run build && npm ci --omit=dev --no-audit --no-fund)
          done

      - name: Package
        run: |
          tag="${GITHUB_REF_NAME}"
          mkdir dist
          # Backend: committed source (no frontends, no deploy tooling) plus uv.lock; the host runs `uv sync --locked`.
          git archive --format=tar.gz --output "dist/rosterchief-${tag}-backend.tar.gz" HEAD -- . ':(exclude)frontend' ':(exclude)deploy' ':(exclude).github'
          # Frontends: built output, package files and production node_modules only.
          tar -czf "dist/rosterchief-${tag}-frontend.tar.gz" \
            $(for app in management controlpanel; do echo frontend/$app/build frontend/$app/package.json frontend/$app/node_modules; done)
          # Host scripts, units and Caddyfiles: installed on the server with every release.
          tar -czf "dist/rosterchief-${tag}-host.tar.gz" -C deploy host
          (cd dist && sha256sum rosterchief-*.tar.gz > SHA256SUMS && cat SHA256SUMS)

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --generate-notes
