# The everyday test job (build-and-push.yml) already runs the suite against a real Postgres
# (postgres:17, the major version compose.yaml pins in production) for every push to
# main/development and every PR into main, and against fast in-memory sqlite for feature-branch
# PRs. So this workflow no longer runs on every push -- that was the same suite a second time.
# What it keeps is the NIGHTLY run on main: the full suite, unsharded, on Postgres, with no code
# change to trigger it. That is what catches things that rot on their own -- a date- or
# time-of-day-dependent test (the one that broke near midnight), a dependency or service drifting
# -- and `workflow_dispatch` lets you run it by hand.
name: Test against Postgres

on:
  schedule:
    # 05:00 UTC, daily -- clear of the low-single-digits-UTC window compose.yaml's own
    # scheduled jobs run in (see DEPLOYMENT.md's "Scheduled jobs"), so a slow CI run here
    # never contends with anything production actually depends on.
    - cron: "0 5 * * *"
  workflow_dispatch:

# Read-only token: this workflow only checks out and runs tests.
permissions:
  contents: read

jobs:
  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rosterchief
          POSTGRES_PASSWORD: rosterchief
          POSTGRES_DB: rosterchief
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - run: uv sync --frozen

      - run: uv run python manage.py test
        env:
          DJANGO_SECRET_KEY: ci-test-not-a-secret
          DJANGO_DATABASE_URL: postgres://rosterchief:rosterchief@localhost:5432/rosterchief
