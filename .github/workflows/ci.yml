name: CI
# Runs on pushes to main only. Everything is gated in order: the fast checks first, then the full test suite, and last the release build.
# `rc release` pushes main and the tag vX.Y.Z together, so the tag is already there when this runs: the final job packages and publishes
# that release only when the pushed commit carries a v* tag. A plain push to main (a hotfix merge, say) runs the checks and stops.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run python manage.py check
        env:
          DJANGO_DEBUG: "True"
          DJANGO_SECRET_KEY: ci-only
          DJANGO_DATABASE_URL: postgresql://localhost/ci
  tests:
    # The full Django suite, on PostgreSQL (django-tenants needs it) like the production hosts. Celery runs tasks inline, so no Redis is needed.
    # Starts only when lint and the Django check passed: no 45-minute run for a typo.
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rosterchief
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: ci-only
      DJANGO_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rosterchief
      CELERY_TASK_ALWAYS_EAGER: "True"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: System libraries for PDF rendering (WeasyPrint)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 fonts-dejavu-core
      - run: uv sync --locked
      - run: uv run python manage.py test --noinput
  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [management, controlpanel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: frontend/${{ matrix.app }}
      - run: npm run build
        working-directory: frontend/${{ matrix.app }}
  secrets:
    # Scans every commit of the push or pull request (full history is fetched) with gitleaks, using .gitleaks.toml.
    # Free for repositories owned by a personal account; a repository owned by an organisation needs a GITLEAKS_LICENSE secret.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  deploy-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -x -P SCRIPTDIR -S warning deploy/rc deploy/lib/*.sh deploy/host/*.sh deploy/cutover/*.sh
      - name: Rehearse the repository cutover on throwaway repositories
        run: bash deploy/cutover/selftest.sh
  release:
    # Last step, and only after every check above passed. Builds and publishes the artifacts the servers download (rc deploy).
    needs: [backend, tests, frontend, secrets, deploy-scripts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the history and every tag
      - name: Is this push a release?
        id: tag
        run: |
          tag=$(git tag --points-at "$GITHUB_SHA" --list 'v*' | sort -V | tail -n 1)
          if [ -z "$tag" ]; then
            echo "No v* tag on $GITHUB_SHA: checks only, nothing to release."
          else
            version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -n 1)
            if [ "v$version" != "$tag" ]; then
              echo "::error::pyproject.toml says $version but the tag is $tag."
              exit 1
            fi
            echo "Releasing $tag"
          fi
          echo "name=$tag" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v5
        if: steps.tag.outputs.name != ''
      - uses: actions/setup-node@v4
        if: steps.tag.outputs.name != ''
        with:
          node-version: 24

      - name: Build the frontends and keep only runtime dependencies
        if: steps.tag.outputs.name != ''
        run: |
          for app in management controlpanel; do
            (cd "frontend/$app" && npm ci --no-audit --no-fund && npm run build && npm ci --omit=dev --no-audit --no-fund)
          done

      - name: Package
        if: steps.tag.outputs.name != ''
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          mkdir dist
          # Backend: committed source (no frontends, no deploy tooling) plus uv.lock; the host runs `uv sync --locked`.
          git archive --format=tar.gz --output "dist/rosterchief-${TAG}-backend.tar.gz" "$TAG" -- . ':(exclude)frontend' ':(exclude)deploy' ':(exclude).github'
          # Frontends: built output, package files and production node_modules only.
          files=()
          for app in management controlpanel; do files+=("frontend/$app/build" "frontend/$app/package.json" "frontend/$app/node_modules"); done
          tar -czf "dist/rosterchief-${TAG}-frontend.tar.gz" "${files[@]}"
          # Host scripts, units and Caddyfiles: installed on the server with every release.
          tar -czf "dist/rosterchief-${TAG}-host.tar.gz" -C deploy host
          (cd dist && sha256sum rosterchief-*.tar.gz > SHA256SUMS && cat SHA256SUMS)

      - name: Publish the release
        if: steps.tag.outputs.name != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: gh release create "$TAG" dist/* --verify-tag --title "$TAG" --generate-notes
