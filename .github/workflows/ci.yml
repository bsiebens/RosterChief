name: CI
on:
  pull_request:
  push:
    branches: [development, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      # Informational for now: the repository still has older ruff findings. Remove continue-on-error once they are fixed.
      - run: uv run ruff check .
        continue-on-error: true
      - run: uv run python manage.py check
        env:
          DJANGO_DEBUG: "True"
          DJANGO_SECRET_KEY: ci-only
          DJANGO_DATABASE_URL: postgresql://localhost/ci
  tests:
    # The full Django suite, on PostgreSQL (django-tenants needs it) like the production hosts. Celery runs tasks inline, so no Redis is needed.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rosterchief
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: ci-only
      DJANGO_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rosterchief
      CELERY_TASK_ALWAYS_EAGER: "True"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: System libraries for PDF rendering (WeasyPrint)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 fonts-dejavu-core
      - run: uv sync --locked
      - run: uv run python manage.py test --noinput
  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [management, controlpanel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: frontend/${{ matrix.app }}
      - run: npm run build
        working-directory: frontend/${{ matrix.app }}
  deploy-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -x -P SCRIPTDIR -S warning deploy/rc deploy/lib/*.sh deploy/host/*.sh deploy/cutover/*.sh
      - name: Rehearse the repository cutover on throwaway repositories
        run: bash deploy/cutover/selftest.sh
