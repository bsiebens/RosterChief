name: CI
on:
  pull_request:
  push:
    branches: [development, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run python manage.py check
        env:
          DJANGO_DEBUG: "True"
          DJANGO_SECRET_KEY: ci-only
          DJANGO_DATABASE_URL: postgresql://localhost/ci
  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [management, controlpanel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: frontend/${{ matrix.app }}
      - run: npm run build
        working-directory: frontend/${{ matrix.app }}
  deploy-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -x -P SCRIPTDIR -S warning deploy/rc deploy/lib/*.sh deploy/host/*.sh
