# Test -> build -> push, strictly in that order. `test` (lint + the full suite) runs on
# every push and every pull request; `build` only runs on a push to `development` or `main`,
# and only once `test` has passed -- see the `needs:`/`if:` on each job below. A red run on a
# branch never produces an image, and nothing reaches ghcr.io that hasn't been linted and
# tested first.
#
# Branch roles (git flow -- see DEPLOYMENT.md's "Branching & release model"):
#   development  the integration branch. Every push here builds+pushes `:development` and
#                auto-deploys the throwaway dev/test instance (the `deploy-dev` job).
#   main         production. Only ever updated by a `release/*`/`hotfix/*` PR merge -- each
#                one IS a release, so a push here also tags `vX.Y.Z` (read from
#                pyproject.toml), pushes that tag, and cuts a GitHub Release. Deploying it to
#                production stays a human's call (deploy/deploy-prod.sh), on purpose.
#
# The image itself is still built on GitHub's own runners (native x86_64, plenty of RAM)
# rather than on the small deploy VPS -- see DEPLOYMENT.md's "Sizing the server" section:
# `docker compose build` (npm + uv + collectstatic together) is the memory spike that OOMs a
# small box, not serving traffic. Building here and pulling on the server sidesteps that
# entirely. deploy/deploy-prod.sh (a human's call, on purpose) and the `deploy-dev` job below
# both do `docker compose pull` instead of `docker compose build` on the server they target.
name: CI

on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Hardcoded lowercase rather than derived from github.repository (bsiebens/RosterChief) --
  # registry image names must be all-lowercase, and the repo's own casing isn't.
  IMAGE_NAME: bsiebens/rosterchief

# Least privilege: every job gets a read-only GITHUB_TOKEN unless it asks for more below.
# Only `build` (packages: write, to push to ghcr.io) and `release` (contents: write, to push
# the vX.Y.Z tag and create the GitHub Release) widen it.
#
# Third-party actions are pinned to full commit SHAs (the `# vX.Y.Z` comment is the tag that
# SHA was resolved from); .github/dependabot.yml keeps them current.
permissions:
  contents: read

jobs:
  test-shard:
    # The suite, split over four jobs by test class (manage.py test --shard=I/N, see
    # rosterchief/test_runner.py). A hosted runner only has a couple of cores, so one job
    # took ~5 minutes; four in parallel each pay the ~30s setup/migrate once and run a
    # quarter of the tests. Lint runs once, in the first shard.
    name: test (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs `uv` itself and provisions the exact Python this project requires
      # (pyproject.toml's requires-python) -- no separate actions/setup-python step needed.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      # --frozen: fails instead of silently re-resolving if uv.lock is out of date, the same
      # guarantee a production build gets from the committed lockfile.
      - run: uv sync --frozen

      - if: matrix.shard == 1
        run: uv run ruff check .

      - run: uv run python manage.py test --shard=${{ matrix.shard }}/4
        env:
          # The only setting with no default (see rosterchief/settings.py) -- a throwaway
          # value, never used for anything real, exists only so Django will start.
          DJANGO_SECRET_KEY: ci-test-not-a-secret

  test:
    # Every push and every PR -- this is the required status check on both `main` and
    # `development` (see DEPLOYMENT.md/deploy/configure-branch-protection.sh), and what
    # `build` waits on. It only gathers the shards into one result, so branch protection
    # and `needs: test` don't have to know how many shards there are. `always()` so a
    # failed shard turns this red rather than skipped -- a skipped required check counts
    # as passing.
    needs: test-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test-shard.result }}" = success

  audit:
    # Known-vulnerability scan of the production dependencies, on every push and PR. Separate
    # from `test` and not a `needs:` of `build` on purpose: an advisory published overnight
    # shouldn't block an unrelated hotfix from shipping. It is still a red check -- accept a
    # specific advisory (with a reason) in .github/pip-audit-ignore.txt rather than ignoring it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # The exact versions in uv.lock, production group only (dev tooling never ships in the
      # image). Git-sourced packages (django-lucide) are not on PyPI, so no advisory database
      # covers them -- they're filtered out rather than making pip-audit refuse the whole file.
      # --no-deps/--disable-pip: the list is already fully resolved; audit exactly it.
      - name: Audit Python dependencies (pip-audit)
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes --format requirements-txt \
            | grep -v ' @ git+' > "$RUNNER_TEMP/requirements.txt"
          ignore_args=()
          while read -r id _; do
            case "$id" in ''|'#'*) continue ;; esac
            ignore_args+=(--ignore-vuln "$id")
          done < .github/pip-audit-ignore.txt
          uvx pip-audit --disable-pip --no-deps --desc -r "$RUNNER_TEMP/requirements.txt" "${ignore_args[@]}"

      # Runtime JS only (htmx, Alpine, Chart.js -- vendored into static/js/). The dev group is
      # the Tailwind build toolchain, which never reaches a browser. Reads package-lock.json
      # directly; no install needed.
      - name: Audit npm dependencies (npm audit)
        run: npm audit --omit=dev --audit-level=high

  build:
    needs: test
    # PRs stop at `test` above -- a branch that hasn't merged has no business publishing an
    # image. Pushes only build from the two long-lived branches; a `release/*`/`hotfix/*`
    # branch is exercised by `test` alone until it merges (its own PR into `main` re-runs
    # `test` on the merge; the image that ships is the one `main` builds once it lands).
    # `workflow_dispatch` is exempt from the ref check so it can still force a rebuild by hand.
    if: github.event_name != 'pull_request' && (github.event_name != 'push' || contains(fromJSON('["refs/heads/main", "refs/heads/development"]'), github.ref))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # push to ghcr.io
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # main only: every push to main is a release/hotfix merge landing, so the version
      # already sitting in pyproject.toml (bumped on the release/hotfix branch itself, as
      # part of that PR) is this release's real version -- read it once here rather than
      # duplicating it in a tag name someone has to remember to type by hand.
      - id: version
        if: github.ref == 'refs/heads/main'
        run: |
          VERSION=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      # Tags each push as `:<branch>` ("latest for this branch" -- `:development` is what
      # deploy-dev.sh pulls, `:main` is still a valid rollback/pin target) and
      # `:<branch>-<short-sha>` (immutable, for pinning an exact build -- see DEPLOYMENT.md's
      # "Deploying a specific version"). On main only, also `:vX.Y.Z` -- the tag
      # deploy-prod.sh should actually be pointed at for a real release, not a floating
      # branch tag (`enable=` skips this line entirely off main, where steps.version never ran).
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-,format=short
            type=raw,value=${{ steps.version.outputs.tag }},enable=${{ steps.version.outputs.tag != '' }}

      # Built once, locally (push: false, load: true means "hand it to the local docker
      # daemon", not "publish it"), and smoke-tested below before anything is actually
      # published. The real build-and-push step further down reuses this same GHA cache, so
      # it costs a re-tag, not a rebuild.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: rosterchief:smoke-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # `check --deploy` inside the image just built, with a production-shaped environment:
      # catches a security setting that regressed (a check that started warning, a default
      # that flipped) before the image is published. Throwaway, per-run random keys: long and
      # random enough to pass rosterchief.E001's placeholder check, never used for anything.
      # --fail-level WARNING is usable because the one warning production raises on purpose
      # (security.W021, HSTS preload) is silenced in settings.py, with the reason there.
      # DJANGO_DATABASE_URL points SQLite at /tmp: since Django 6.1 `check` runs field checks
      # against every configured database, and JSONField's SQLite support check opens a real
      # connection -- the default db.sqlite3 under the read-only /app can't be created.
      - name: Deployment checks in the built image
        run: |
          docker run --rm \
            -e DJANGO_DEBUG=False \
            -e DJANGO_SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(64))')" \
            -e MFA_ENCRYPTION_KEY="$(python3 -c 'import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')" \
            -e DJANGO_ALLOWED_HOSTS=.rosterchief.example \
            -e DJANGO_CSRF_TRUSTED_ORIGINS=https://rosterchief.example \
            -e DJANGO_SECURE_SSL_REDIRECT=True \
            -e DJANGO_SESSION_COOKIE_SECURE=True \
            -e DJANGO_CSRF_COOKIE_SECURE=True \
            -e DJANGO_SECURE_HSTS_SECONDS=31536000 \
            -e DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS=True \
            -e DJANGO_STATICFILES_BACKEND=whitenoise.storage.CompressedManifestStaticFilesStorage \
            -e DJANGO_DATABASE_URL=sqlite:////tmp/check.sqlite3 \
            rosterchief:smoke-test \
            python manage.py check --deploy --fail-level WARNING

      # Confirms the image actually boots and serves traffic before it's published -- catches
      # e.g. a broken entrypoint or a missing static file that no unit test would ever see.
      # No Postgres/Redis alongside it: DJANGO_DATABASE_URL/DJANGO_REDIS_URL are both left
      # unset, so the app falls back to its own dev defaults (sqlite, local-memory cache) --
      # exactly like running it locally with no .env -- which is enough for /healthz's own
      # "can I reach my database and cache" check to go green without standing up real infra
      # just for this one check.
      - name: Smoke test the built image
        run: |
          # Same lockdown as compose.yaml's web service (read-only root, tmpfs /tmp, no
          # capabilities), so this proves the hardened container starts. No database service
          # here: SQLite in /tmp -- the app code in /app is read-only to the app user.
          docker run -d --name smoke -p 8000:8000 \
            --read-only --tmpfs /tmp:size=256m,mode=1777 \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -e DJANGO_SECRET_KEY=ci-smoke-not-a-secret \
            -e DJANGO_ALLOWED_HOSTS='*' \
            -e DJANGO_DATABASE_URL=sqlite:////tmp/smoke.sqlite3 \
            rosterchief:smoke-test
          for attempt in $(seq 1 20); do
            if curl -fsS http://localhost:8000/healthz; then
              echo "Healthy after ${attempt} check(s)."
              exit 0
            fi
            sleep 3
          done
          echo "ERROR: image never became healthy." >&2
          docker logs smoke >&2
          exit 1

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    # main only, and only once: tags the commit vX.Y.Z and cuts a GitHub Release from it,
    # after `build` has published the image. Its own job so that contents: write (needed to
    # push a tag and create a release) is granted to these few lines only, not to the job that
    # runs the Docker build. Idempotent -- re-running the workflow (workflow_dispatch, a retry)
    # against a version already tagged skips both rather than failing the job over it.
    needs: build
    if: needs.build.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # `git rev-parse`/`git tag` below need real history and tags, not the default shallow clone

      - name: Tag the release and publish GitHub Release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists -- pyproject.toml's version wasn't bumped for this merge, or this run is a retry. Skipping."
            exit 0
          fi
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --target main --generate-notes --title "$TAG"

  deploy-dev:
    needs: build
    # Only a push to development actually deploys anything -- `build` above also runs on
    # main, and this job must not react to that (deploying development's image in response to
    # a main-branch release would be wrong, not just redundant). Opt-in beyond that: the
    # deploy step itself skips until DEV_SSH_HOST is configured (Settings -> Secrets and
    # variables -> Actions -- not something this workflow file can set for you).
    #
    # The secrets check used to live in this job's own `if:` -- GitHub Actions rejects
    # `secrets` in ANY `if:` conditional, job-level or step-level alike
    # ("Unrecognized named-value: 'secrets'"), and that isn't just a skipped job, it fails
    # the *entire workflow file* as invalid before any job (including `test`/`build` above)
    # ever runs. So the job always runs when the ref matches -- one cheap checkout -- and the
    # deploy step itself always runs too; whether it actually does anything is a plain shell
    # `if` on its own env var, inside `run:`, where `secrets`-derived values are just strings.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/development' }}
    runs-on: ubuntu-latest
    # A GitHub Environment, so protection rules (required reviewers, a wait timer, branch
    # restrictions) can be added under Settings -> Environments -> dev without touching this
    # file. The secrets below are read as repository secrets today; environment-scoped secrets
    # of the same name would take precedence if they're ever moved there.
    environment: dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # deploy-dev.sh's own preflight checks `origin/<branch>` locally -- a shallow,
          # single-commit checkout still has that ref, so the default depth is fine.
          fetch-depth: 1

      - name: Deploy to the dev instance
        env:
          SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          SSH_USER: ${{ secrets.DEV_SSH_USER }}
          REMOTE_DIR: ${{ secrets.DEV_REMOTE_DIR }}
          # Passed through the environment, never interpolated into the script text, so the
          # key's content can't be parsed as shell.
          DEV_SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
          # The dev host's public host key(s), in known_hosts format, captured once from a
          # trusted machine and verified against the server's own fingerprint (DEPLOYMENT.md).
          # Pinned rather than fetched with ssh-keyscan at deploy time: a scan from the runner
          # trusts whatever answers on first use, which is exactly what host keys guard against.
          DEV_SSH_KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
          BRANCH: development
        run: |
          if [ -z "$SSH_HOST" ]; then
            echo "DEV_SSH_HOST not configured (Settings -> Secrets and variables -> Actions) -- skipping dev deploy."
            exit 0
          fi
          if [ -z "$DEV_SSH_KNOWN_HOSTS" ]; then
            echo "::error::DEV_SSH_KNOWN_HOSTS is not set. Add the dev host's known_hosts line(s) as a secret (see DEPLOYMENT.md) -- the deploy refuses to trust an unverified host key."
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEV_SSH_KEY" > ~/.ssh/id_dev_deploy
          chmod 600 ~/.ssh/id_dev_deploy
          printf '%s\n' "$DEV_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          # deploy-dev.sh builds its own ssh command line; the host-key policy comes from here.
          printf 'Host *\n  StrictHostKeyChecking yes\n  UserKnownHostsFile ~/.ssh/known_hosts\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config
          SSH_KEY_FILE=~/.ssh/id_dev_deploy ./deploy/deploy-dev.sh
