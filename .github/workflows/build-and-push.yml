# Builds the app image on GitHub's own runners (native x86_64, plenty of RAM) instead of on
# the small deploy VPS -- see DEPLOYMENT.md's "Sizing the server" section: `docker compose
# build` (npm + uv + collectstatic together) is the memory spike that OOMs a small box, not
# serving traffic. Building here and pulling on the server sidesteps that entirely.
#
# Runs on every push to main/development; deploy/deploy-dev.sh (and whatever drives the real
# prod deploy) then does `docker compose pull` instead of `docker compose build` on the server.
name: Build and push image

on:
  push:
    branches: [main, development]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Hardcoded lowercase rather than derived from github.repository (bsiebens/RosterChief) --
  # registry image names must be all-lowercase, and the repo's own casing isn't.
  IMAGE_NAME: bsiebens/rosterchief

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags each push as both :<branch> ("latest for this branch", what deploy scripts pull
      # by default) and :<branch>-<short-sha> (immutable, for pinning/rollback -- see
      # DEPLOYMENT.md's "Deploying a specific version").
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
