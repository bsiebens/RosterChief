# Weekly dependency update PRs, all targeting `development` (git flow: nothing lands on `main`
# except through a release/hotfix PR). Minor and patch updates are grouped into one PR per
# ecosystem to keep the noise down; major updates still arrive one PR each, since those are
# the ones that need reading. Security updates are separate and not limited by this schedule
# (enable them under Settings -> Code security -> Dependabot security updates).
version: 2

updates:
  # Workflow actions are pinned by commit SHA; Dependabot bumps the SHA and its `# vX.Y.Z`
  # comment together.
  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    groups:
      github-actions-minor-patch:
        update-types: [minor, patch]

  # pyproject.toml + uv.lock.
  - package-ecosystem: uv
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  # Tailwind/daisyUI build toolchain and the vendored runtime JS (htmx, Alpine, Chart.js).
  # A bump to a vendored runtime package also needs its `npm run vendor:*` script re-run.
  - package-ecosystem: npm
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  # Base images of the app image (Dockerfile) and the Caddy image (deploy/caddy/Dockerfile).
  - package-ecosystem: docker
    directories:
      - /
      - /deploy/caddy
    target-branch: development
    schedule:
      interval: weekly
    groups:
      docker-minor-patch:
        update-types: [minor, patch]

  # Service images referenced directly from compose*.yaml (postgres, redis, ...).
  - package-ecosystem: docker-compose
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    groups:
      docker-compose-minor-patch:
        update-types: [minor, patch]
