{% load i18n %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{ title }} · {% trans "RosterChief app API" %}</title>
<style>
  :root { --bg: #ffffff; --fg: #1f2937; --muted: #6b7280; --line: #e5e7eb; --accent: #1e40af; --code-bg: #f3f4f6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f172a; --fg: #e5e7eb; --muted: #9ca3af; --line: #1f2937; --accent: #93c5fd; --code-bg: #1e293b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  header { border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 4px 20px; align-items: baseline; }
  header strong { margin-right: 12px; }
  header a { color: var(--muted); text-decoration: none; }
  header a[aria-current="page"] { color: var(--accent); font-weight: 600; }
  main { max-width: 860px; margin: 0 auto; padding: 16px 16px 64px; }
  a { color: var(--accent); }
  h1 { font-size: 1.9rem; line-height: 1.25; }
  h2 { margin-top: 2.2rem; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
  code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; font-size: 0.9em; }
  pre { background: var(--code-bg); padding: 12px 14px; border-radius: 8px; overflow-x: auto; line-height: 1.45; }
  pre code { background: none; padding: 0; }
  table { border-collapse: collapse; width: 100%; display: block; overflow-x: auto; font-size: 0.95em; }
  th, td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
  blockquote { margin: 1rem 0; padding: 4px 14px; border-left: 3px solid var(--accent); color: var(--muted); }
</style>
</head>
<body>
<header>
  <strong>{% trans "RosterChief app API" %}</strong>
  {% for item in nav %}<a href="{{ item.href }}"{% if item.current %} aria-current="page"{% endif %}>{{ item.title }}</a>{% endfor %}
  <a href="/api/v1/docs">{% trans "API reference" %}</a>
  <a href="/api/auth/openapi.html">{% trans "Sign-in API reference" %}</a>
</header>
<main>{{ body }}</main>
</body>
</html>
