<tr><td style="padding:0 32px 8px;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f8fafc;border-radius:10px;">
    <tr><td style="padding:16px 20px;font-size:14px;line-height:1.9;color:#334155;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
        {% for label, value in rows %}
        <tr>
          <td style="padding:2px 0;color:#64748b;">{{ label }}</td>
          <td align="right" style="padding:2px 0;color:#0f172a;{% if forloop.last and highlight %}font-weight:800;font-size:16px;{% endif %}">{{ value }}</td>
        </tr>
        {% endfor %}
      </table>
    </td></tr>
  </table>
</td></tr>
