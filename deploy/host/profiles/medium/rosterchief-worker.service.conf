# Sizing profile "medium" (a 2 GB host). A pool child that grows past ~200 MB is replaced after its current task (PDF rendering is the big one).
[Service]
ExecStart=
ExecStart=/opt/rosterchief/current/.venv/bin/celery -A rosterchief worker --loglevel=INFO --concurrency=2 --max-memory-per-child=200000
MemoryHigh=350M
MemoryMax=450M
