# Sizing profile "small" (a 1 GB host): one gunicorn worker, and Celery tasks run inside the request because there is no worker.
[Service]
Environment=CELERY_TASK_ALWAYS_EAGER=True
ExecStart=
ExecStart=/opt/rosterchief/current/.venv/bin/gunicorn rosterchief.wsgi:application --bind 127.0.0.1:8000 --workers 1 --threads 2 --timeout 180 --graceful-timeout 30
MemoryHigh=320M
MemoryMax=420M
