[project]
name = "RosterChief"
version = "1.0.0-alpha1"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "celery-types>=0.26.0",
    "celery[redis]>=5.6.3",
    "django>=6.1.2",
    "django-allauth[headless-spec,mfa]>=65.21.1",
    "django-celery-beat>=2.1.0",
    "django-celery-results>=2.6.0",
    "django-countries>=9.1.0",
    "django-database-url>=1.0.3",
    "django-extensions>=4.1",
    "django-lucide>=1.3.1",
    "django-ninja>=1.7.3",
    "django-phonenumber-field[phonenumbers]>=9.0.0",
    "django-tenant-users>=3.0.1",
    "django-tenants>=4.0.1",
    "google-auth>=2.62.0",
    "httpx[http2]>=0.28.1",
    "markdown>=3.11.3",
    "nh3>=0.3.7",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.6",
    "pyjwt[crypto]>=2.15.1",
    "python-dateutil>=4.0.0",
    "python-decouple>=3.8",
    "pywebpush>=2.5.0",
    "requests>=2.34.2",
    "tenant-schemas-celery>=5.0.0",
    "weasyprint>=70.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 250
target-version = "py314"
# Auto-generated migrations are not hand-maintained code.
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
    "UP", # pyupgrade
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "DJ", # flake8-django
    "RUF", # ruff-specific rules
]
ignore = [
    "RUF012", # Django/Wagtail model attrs (panels, Meta.ordering, ...) are framework conventions, not mutable defaults to guard.
    "RUF005", # Wagtail's `Page.content_panels + [...]` concatenation is the documented idiom.
]

[tool.ruff.lint.per-file-ignores]
# Settings legitimately use star imports and long generated values.
"rosterchief/settings/*" = ["F403", "F405", "E501"]

[tool.uv.sources]
django-lucide = { git = "https://github.com/bsiebens/lucide" }

[tool.uv]
override-dependencies = [
    "django>=6.1.1",
]
