[project]
name = "RosterChief"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.2",
    "django-allauth[headless-spec,mfa]>=65.21.1",
    "django-database-url>=1.0.3",
    "django-extensions>=4.1",
    "django-lucide>=1.3.1",
    "django-ninja>=1.7.3",
    "django-tenant-users>=3.0.1",
    "django-tenants>=4.0.1",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.6",
    "python-decouple>=3.8",
]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 250
target-version = "py314"
# Auto-generated migrations are not hand-maintained code.
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
    "UP", # pyupgrade
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "DJ", # flake8-django
    "RUF", # ruff-specific rules
]
ignore = [
    "RUF012", # Django/Wagtail model attrs (panels, Meta.ordering, ...) are framework conventions, not mutable defaults to guard.
    "RUF005", # Wagtail's `Page.content_panels + [...]` concatenation is the documented idiom.
]

[tool.ruff.lint.per-file-ignores]
# Settings legitimately use star imports and long generated values.
"rosterchief/settings/*" = ["F403", "F405", "E501"]

[tool.uv.sources]
django-lucide = { git = "https://github.com/bsiebens/lucide" }
