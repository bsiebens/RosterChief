[project]
name = "rosterchief"
version = "0.12.0"
requires-python = ">=3.14"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "apscheduler>=3.11.3",
    "beautifulsoup4>=4.15.0",
    "defusedxml>=0.7.1",
    "dj-database-url>=3.1.2",
    "django>=6.1.1",
    "django-allauth[mfa,headless,headless-spec]>=65.19.4",
    "django-countries>=9.1.0",
    "django-lucide",
    "django-ninja>=1.6.2",
    "django-phonenumber-field[phonenumbers]>=8.5.0",
    "django-redis>=7.0.0",
    "django-storages[s3]>=1.14.6",
    "django-waffle>=5.0.0",
    "gunicorn>=26.2.0",
    "icalendar>=6.1.0",
    "markdown>=3.11",
    "nh3>=0.3.7",
    "openpyxl>=3.1.5",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.6",
    "python-dateutil>=2.9.0.post0",
    "python-decouple>=3.8",
    "pywebpush>=2.5.0",
    "qrcode>=8.2",
    "requests>=2.34.2",
    "weasyprint>=69.0",
    "whitenoise>=6.12.0",
    "httpx[http2]>=0.28",
    "google-auth>=2.62.0",
    "pyjwt>=2.15.1",
    "cryptography>=50.0.2",
]

[dependency-groups]
dev = [
    "coverage>=7.16.2",
    "django-browser-reload>=1.21.0",
    "ruff>=0.16.9",
    "tblib>=3.2.2",
]

[tool.ruff]
line-length = 250
target-version = "py314"
# Auto-generated migrations are not hand-maintained code.
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
    "UP", # pyupgrade
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "DJ", # flake8-django
    "RUF", # ruff-specific rules
]
ignore = [
    "RUF012", # Django/Wagtail model attrs (panels, Meta.ordering, ...) are framework conventions, not mutable defaults to guard.
    "RUF005", # Wagtail's `Page.content_panels + [...]` concatenation is the documented idiom.
]

[tool.ruff.lint.per-file-ignores]
# Settings legitimately use star imports and long generated values.
"rosterchief/settings/*" = ["F403", "F405", "E501"]

[tool.ruff.lint.isort]
known-first-party = [
    "api", "billing", "bugs", "announcements", "authentication", "club", "members", "teams", "events", "formbuilder", "evaluations", "shop", "registration", "controlpanel", "management", "marketing", "mobile", "news", "notifications", "features", "appapi", "rosterchief"]

[tool.uv.sources]
django-lucide = { git = "https://github.com/bsiebens/lucide" }
