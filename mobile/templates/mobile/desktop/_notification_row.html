{% load i18n %}
{% comment %}
    Desktop counterpart of mobile/_notification_row.html -- same fields/
    logic, `.m-card` -> `.card`. Expects ``row`` ({notification,
    source_label}) in scope.
{% endcomment %}
<form method="post" action="{% url "mobile:notifications" %}" hx-boost="false">
    {% csrf_token %}
    <input type="hidden" name="action" value="mark_read">
    <input type="hidden" name="notification_id" value="{{ row.notification.pk }}">
    <button type="submit" class="card flex w-full items-center gap-3.5 p-4 text-left hover:bg-subhead">
        <span class="w-1 shrink-0 self-stretch rounded-full {% if not row.notification.read_at %}bg-red-600{% else %}bg-line{% endif %}"></span>
        <span class="min-w-0 flex-1">
            <span class="block text-sm {% if row.notification.read_at %}font-normal text-slate{% else %}font-bold text-ink{% endif %}">{{ row.title }}</span>
            <span class="block text-xs text-muted">{{ row.body }}</span>
            <span class="block text-xs text-dim">{% if row.person %}{{ row.person }} &middot; {% endif %}{% blocktrans with ago=row.notification.created|timesince %}{{ ago }} ago{% endblocktrans %}</span>
        </span>
    </button>
</form>
