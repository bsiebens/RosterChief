{% load i18n %}
<div class="card overflow-hidden">
    <table class="table">
        <thead><tr><th colspan="2">{{ title }}</th></tr></thead>
        <tbody>
            {% for row in rows %}
                <tr>
                    <td>{% if row.number is not None %}#{{ row.number }} {% endif %}{{ row.name }}</td>
                    <td class="text-right font-mono font-semibold">{{ row.total }}</td>
                </tr>
            {% empty %}
                <tr><td colspan="2" class="text-muted">{% trans "No data yet." %}</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
